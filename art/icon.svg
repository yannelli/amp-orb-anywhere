<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Amp Orb Anywhere icon</title>
  <desc id="desc">A sky-blue orb surrounding a terminal prompt and cursor, with a runner node in orbit.</desc>
  <defs>
    <radialGradient id="background" cx="58%" cy="44%" r="72%">
      <stop offset="0" stop-color="#0b1a27"/>
      <stop offset="0.55" stop-color="#071019"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="orb" x1="294" y1="292" x2="744" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8e4ff"/>
      <stop offset="0.48" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#289de3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>

  <g fill="none">
    <circle cx="512" cy="512" r="354" stroke="#5cc8ff" stroke-width="4" opacity="0.28"/>
    <circle cx="512" cy="512" r="272" stroke="#5cc8ff" stroke-width="54" opacity="0.12" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="272" fill="#07111a" stroke="url(#orb)" stroke-width="42"/>
  </g>

  <path d="M390 398 505 512 390 626" fill="none" stroke="#f7fafc" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="558" y="478" width="70" height="68" rx="12" fill="#5cc8ff"/>

  <rect x="746" y="226" width="42" height="42" rx="9" fill="#5cc8ff" transform="rotate(45 767 247)"/>
</svg>
